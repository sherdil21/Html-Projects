<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - Book your ticket</title>
</head>

<body>
    <h1>Book your ticket - train.com</h1>
    <form action="">
        <div>
            <label for="username">Enter you name: </label>
            <input type="text" name="username" id="username" placeholder="username" required autofocus>
        </div>
        <div>
            <label for="">Gender:</label> <br>
            <input type="radio" name="Gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="Gender" id="female">
            <label for="female">Female</label>
        </div>
        <br>
        <div>
            <label for="">Class:</label> <br>
            <input type="checkbox" name="Seat_Class" id="first_Class">
            <label for="first_Class">First class</label> <br>
            <input type="checkbox" name="Seat_Class" id="business_Class">
            <label for="business_Class">Business class</label> <br>
            <input type="checkbox" name="Seat_Class" id="economy_Class">
            <label for="economy_Class">Economy class</label>
        </div>
        <div>
            <select name="" id="fruits">
                <option value="banana">Banana</option>
                <option value="cherry">Cherry</option>
                <option value="orange">Orange</option>
                <option value="bluebarry">Bluebarry</option>
                <option value="apple">Apple</option>
            </select>
        </div>
    </form>
</body>

</html>
